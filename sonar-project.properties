# Tests live inside the package (heat/tests). Main and test sources share the
# heat/ root and are split with inclusion/exclusion patterns so they stay disjoint.
sonar.sources=heat
sonar.tests=heat
sonar.exclusions=heat/tests/**,heat/locale/**
sonar.test.inclusions=heat/tests/**

# Python coverage, produced in CI by:
#     coverage combine && coverage xml -o coverage.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11, 3.12, 3.13
